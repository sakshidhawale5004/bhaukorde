<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Redirect – Bhau Korde Masale</title>
<script>
(function() {
  var path = window.location.pathname || "";
  var match = path.match(/product-([^/]+)\.html$/i);
  if (match && match[1]) {
    var slug = match[1];
    var target = "bhau-site/product.html?id=" + encodeURIComponent(slug);
    window.location.replace(target);
    return;
  }
  window.location.replace("bhau-site/index.html");
})();
</script>
<style>
body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #faf5ee; color: #271f1a; text-align: center; }
.card { background: #fff; padding: 40px; border-radius: 12px; border: 1px solid #e7ded5; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
h2 { margin: 0 0 10px; color: #c8501e; font-family: 'Jost', serif; }
a { color: #c8501e; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h2>Loading Product Page...</h2>
  <p>Connecting to Bhau Korde Masale live catalog.</p>
  <p><a href="bhau-site/index.html">← Return to Storefront</a></p>
</div>
</body>
</html>
